name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -project AnimeVerse.xcodeproj -scheme AnimeVerse

      - name: Build (and compile tests, without running on a simulator)
        run: |
          xcodebuild build-for-testing \
            -project AnimeVerse.xcodeproj \
            -scheme AnimeVerse \
            -destination 'generic/platform=iOS Simulator'
