name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List installed Xcode versions
        run: ls -d /Applications/Xcode*.app

      - name: Select an Xcode with a working iOS Simulator destination
        run: |
          for app in $(ls -d /Applications/Xcode_*.app | sort -Vr); do
            sudo xcode-select -switch "$app"
            echo "Trying $app ..."
            if xcodebuild -showdestinations -project AnimeVerse.xcodeproj -scheme AnimeVerse 2>/dev/null \
                | grep -E "platform:iOS Simulator" | grep -q "id:[0-9A-Fa-f-]\{36\}"; then
              echo "✅ Using $app (has a working iOS Simulator destination)"
              break
            else
              echo "⚠️  $app has no usable iOS Simulator destination, trying next..."
            fi
          done

      - name: Show selected Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -project AnimeVerse.xcodeproj -scheme AnimeVerse

      - name: Build & Test
        run: |
          xcodebuild test \
            -project AnimeVerse.xcodeproj \
            -scheme AnimeVerse \
            -destination 'platform=iOS Simulator,name=iPhone 16'
