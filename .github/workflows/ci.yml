name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.2.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -project AnimeVerse.xcodeproj -scheme AnimeVerse

      - name: Build & Test
        run: |
          xcodebuild test \
            -project AnimeVerse.xcodeproj \
            -scheme AnimeVerse \
            -destination 'platform=iOS Simulator,name=iPhone 16'
